version: 2.0

jobs:
  build:
    working_directory: ~/project
    
    docker:
      - image: circleci/python:3.8.5

    steps:
      - checkout:
          path: ~/project

      - run: sudo apt update

      - run:
          name: Build 🏗
          working_directory: ~/project
          command: |
            echo 'export PYTHONPATH=$PWD' >> $BASH_ENV
            source $BASH_ENV
            
            echo ${CIRCLE_WORKING_DIRECTORY}
            echo ${PYTHONPATH}
            python3 build/build.py
      - run:
          name: Deploy 🚀
          working_directory: ~/project/build
          command: ./deploy.sh